[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schwab-readonly-mcp"
version = "0.1.0"
description = "A local, read-only Schwab market-data and account MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.10,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<0.7",
]

[project.scripts]
schwab-readonly-mcp = "schwab_readonly_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_readonly_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
